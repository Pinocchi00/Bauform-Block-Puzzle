<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#C1BAAE" />
    <title>Bauform</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <!-- APP:START -->
    <div id="app" data-screen="play">
      <svg id="decor" aria-hidden="true"></svg>
      <svg id="board" aria-hidden="true"><g id="camera"><g id="figure"></g><g id="preview"></g></g></svg>

      <header id="hud">
        <div id="shape-status" aria-label="Forme en cours">
          <span class="mini-label">Forme</span><strong id="shape-number">01</strong>
        </div>
        <div id="score-box">
          <div id="score-label">Score</div>
          <div id="score">0</div>
          <div id="shape-progress" role="progressbar" aria-label="Progression de la forme" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span id="shape-progress-fill"></span>
          </div>
          <div id="gain" aria-live="polite"></div>
        </div>
        <button id="pause-btn" class="icon-btn" aria-label="Mettre en pause"></button>
      </header>

      <div id="tray">
        <div id="tray-caption" aria-hidden="true">Choisir une pièce</div>
        <div class="slot" data-slot="0"></div>
        <div class="slot" data-slot="1"></div>
        <div class="slot" data-slot="2"></div>
      </div>

      <div id="tutorial" hidden>
        <div id="tuto-ghost" aria-hidden="true"><svg id="tuto-piece"></svg><div class="tuto-finger"></div></div>
        <p id="tuto-text"><strong>Glisser une pièce dans la forme</strong><span>Remplir toute la forme pour passer à la suivante</span></p>
      </div>

      <svg id="drag-layer" aria-hidden="true"><g id="drag-piece"></g></svg>

      <section id="pause-screen" class="screen">
        <div class="head">
          <div class="eyebrow">En pause</div>
          <div class="big-score" id="pause-score">0</div>
          <div class="record-line"><span class="crown"></span><span id="pause-record">0</span></div>
        </div>
        <div class="menu">
          <label class="row" for="opt-sound"><span>Son</span><input type="checkbox" id="opt-sound" class="switch" /></label>
          <label class="row" for="opt-vibrations"><span>Vibrations</span><input type="checkbox" id="opt-vibrations" class="switch" /></label>
          <button class="row link" id="restart-btn"><span>Recommencer</span><span class="ico" data-icon="restart"></span></button>
        </div>
        <button id="resume-btn" class="round-btn" aria-label="Reprendre"></button>
      </section>

      <section id="over-screen" class="screen">
        <div class="head">
          <div class="eyebrow">Composition nº <span id="over-number">01</span></div>
          <div class="big-score xl" id="over-score">0</div>
          <div class="record-line" id="over-record"></div>
          <div class="over-meta"><span id="over-shapes">0 formes</span><span class="dot" aria-hidden="true"></span><span id="over-pieces">0 pièces</span></div>
        </div>
        <div id="over-figure-box">
          <svg id="over-figure" aria-label="Votre figure"></svg>
          <button id="expand-btn" class="icon-btn" aria-label="Voir la figure en plein écran"></button>
          <button id="share-btn" class="icon-btn" aria-label="Partager l'affiche"></button>
        </div>
        <div class="actions">
          <button id="retry-btn" class="btn outline"><span class="ico" data-icon="restart"></span>Réessayer la forme</button>
          <button id="replay-btn" class="btn solid">Rejouer</button>
        </div>
      </section>

      <section id="full-screen" class="screen"><svg id="full-figure" aria-label="Votre figure"></svg><div class="full-hint">Toucher pour revenir</div></section>

      <section id="ad-screen" class="screen">
        <div class="ad-label">[PUB]</div>
        <div id="ad-count"></div>
      </section>

      <section id="debug-screen" class="screen">
        <div class="debug-head">
          <strong>Mesures</strong>
          <button id="debug-close" class="icon-btn" aria-label="Fermer">✕</button>
        </div>
        <div id="debug-summary"></div>
        <div class="debug-table"><table id="debug-table"></table></div>
        <div id="debug-current"></div>
        <button id="debug-clear" class="btn outline small">Effacer les mesures</button>
      </section>
    </div>
    <!-- APP:END -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
